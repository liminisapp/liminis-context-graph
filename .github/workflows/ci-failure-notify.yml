name: CI Failure Notify

# Turns a failing run of one of this repo's non-gating workflows/jobs (the real-corpus
# e2e jobs, bench, eval — see docs/adr/0298-ci-failure-notification.md) into a durable,
# human-visible GitHub issue instead of a result that only shows up if someone opens
# the Actions tab. #298: the e2e suite failed 24 consecutive runs over 4 days with
# no signal to anyone, and the first any human noticed was during v0.11.0 release
# smoke-testing, after the tag had already been pushed.
#
# Deliberately NOT a required PR check (FR-006) — it is a workflow_run listener that
# fires strictly after the watched workflows complete, so it cannot appear in branch
# protection's required_status_checks and cannot block a merge. Coverage today:
# "CI" (ci.yml — see note below), bench.yml, eval.yml, "Swift sidecar CI" (swift.yml,
# re-enabled 2026-08-25 by #502 — see docs/adr/0502-pin-explicit-macos-runner-for-swift-sidecar-ci.md).
# claude-review.yml is excluded because it only triggers on pull_request and never runs
# against main directly.
#
# #341: the five real-corpus e2e jobs used to live in their own top-level workflow file
# ("Real-Corpus E2E") specifically so they'd have their own workflow_run identity for
# this listener, independent of ci.yml's required `test` job. They were merged bodily
# into ci.yml (see docs/adr/0341-build-release-artifacts-once.md) so `needs:`/artifact sharing could gate them on
# a shared build job at job granularity — a restructuring `workflow_run` can't see
# through. "Real-Corpus E2E" no longer exists as a workflow, so it's replaced by "CI"
# below. This is a deliberate broadening, not just a rename: this listener now also
# fires for a post-merge failure of `test` itself (release build, clippy, R-003
# bench), which it never did before. That's an intentional side effect (a `test`
# failure on `main` going unnoticed is arguably worse than the gap this widens), not an
# oversight — see ADR-0341.
#
# #640: ci.yml now fails fast — the first failing post-build job runs `gh run cancel`, so a
# genuinely failing run can end with conclusion `cancelled`. `cancelled` therefore no longer
# means "superseded, ignore": the `gate` step below treats a cancelled run as actionable only
# if the jobs API shows a real failure (a job that failed/timed out, or any failed step). A
# run cancelled purely by a superseding push has neither and stays a no-op. See ADR-0640.
on:
  workflow_run:
    workflows:
      - "CI"
      - "Perf Benchmarks"
      - "Extraction-Quality Eval"
      - "Swift sidecar CI"
    types: [completed]

permissions:
  issues: write
  actions: read
  contents: read

# Serialized per source workflow: label-based dedup (the "Find existing tracking
# issue" step below) isn't atomic, so two failing runs of the same workflow that
# complete close together could both observe "no existing issue" and both create
# one, violating FR-002. Queuing (not cancelling) same-workflow listener runs
# closes that race. Note this only protects against the *concurrent-create* race,
# not event loss: GitHub cancels a *pending* (queued, not-yet-started) run in a
# concurrency group when a newer run is queued behind it, regardless of
# cancel-in-progress — only the currently-running run is exempt from that. So a
# fast burst of events for the same workflow (e.g. fail, succeed, fail again) can
# skip the intermediate ones; only the last-queued run for the group is guaranteed
# to eventually execute. That's sufficient here because each run re-derives state
# from GitHub (gh issue list) rather than carrying it forward, so the one event
# that does run always reconciles the issue to the correct end state — it's the
# concurrent double-create that must be prevented, not every individual event
# being processed.
concurrency:
  group: ci-failure-notify-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false

jobs:
  notify:
    name: notify (${{ github.event.workflow_run.name }})
    runs-on: ubuntu-latest
    # ci.yml also declares workflow_dispatch with no branch restriction (in addition to
    # push: branches: [main] and pull_request), and bench.yml/eval.yml are
    # workflow_dispatch-only — all three can be run against any ref. Without this
    # guard, a developer's manual dispatch of any of them on a feature branch would
    # file a "main is broken" issue.
    #
    # ci.yml has a `pull_request` trigger, which makes head_branch alone unreliable:
    # it isn't namespaced by repository, so a *fork* PR whose own branch happens to be
    # named "main" (a common default branch name) reports head_branch == 'main' even
    # though the run is a PR-path run against the fork's main, not a push to this
    # repo's main. Excluding event == 'pull_request' closes that gap while still
    # firing for push-to-main and workflow_dispatch-against-main — the two cases the
    # guard above exists for.
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      # jq selector for a *genuinely* failing job: one whose conclusion is neither
      # success/skipped/cancelled (so timed_out/action_required still count), or one that
      # is marked cancelled but holds a failed step (#640 — a job that issued the fail-fast
      # cancel can itself be reported cancelled while its failed step keeps `failure`).
      # Cancelled siblings with no failed step are excluded, so the issue names the real cause.
      FAILING_JOB_JQ: 'select((.conclusion != null and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "cancelled") or ((.steps // []) | any(.conclusion == "failure")))'
    steps:
      # Decides whether this run is a signal at all. ci.yml's `cancel-in-progress: true`
      # means a run superseded by a newer push reports 'cancelled' — that is not a failure
      # signal. But ci.yml's fail-fast (#640) can also leave a run `cancelled` after a real
      # failure, which IS one. The jobs API tells them apart: only the latter has a
      # genuinely failing job. `success` stays actionable so an open issue still resolves.
      - name: Decide whether the run is actionable
        id: gate
        run: |
          # This job sets no default shell, so GitHub's bare `bash -e` has no pipefail. Without
          # it a failed `gh api` would feed empty input to `jq -s`, read as "no failed job",
          # and silently drop a real failure as if it were a supersede-cancellation.
          set -o pipefail
          case "$CONCLUSION" in
            success) actionable=true ;;
            skipped) actionable=false ;;
            cancelled)
              jobs_json=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
                | jq -s '{jobs: [.[].jobs[]]}')
              n=$(echo "$jobs_json" | jq "[.jobs[] | $FAILING_JOB_JQ] | length")
              if [ "$n" -gt 0 ]; then
                echo "Run concluded 'cancelled' but $n job(s) genuinely failed (fail-fast) — actionable."
                actionable=true
              else
                echo "Run concluded 'cancelled' with no failed job (superseded) — not a signal, no-op."
                actionable=false
              fi
              ;;
            *) actionable=true ;;
          esac
          echo "actionable=$actionable" >> "$GITHUB_OUTPUT"

      - name: Derive workflow slug and labels
        if: steps.gate.outputs.actionable == 'true'
        id: labels
        run: |
          slug=$(basename "$WORKFLOW_PATH" .yml)
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "workflow_label=workflow:$slug" >> "$GITHUB_OUTPUT"

      # Defensive on every run (not a one-time setup step): gh issue create/list
      # fails outright against a label that doesn't exist yet, so the very first
      # real failure could otherwise be dropped silently — exactly the kind of gap
      # this workflow exists to close. Only "already exists" is swallowed; any
      # other failure (permissions, rate limiting, API error) fails the run loudly
      # instead of silently defeating the notification mechanism downstream.
      - name: Ensure labels exist
        if: steps.gate.outputs.actionable == 'true'
        env:
          WORKFLOW_LABEL: ${{ steps.labels.outputs.workflow_label }}
        run: |
          create_label() {
            local name="$1" desc="$2" out
            if ! out=$(gh label create "$name" --color B60205 --description "$desc" 2>&1); then
              if ! grep -qi "already exists" <<<"$out"; then
                echo "::error::gh label create failed for '$name': $out"
                exit 1
              fi
            fi
          }
          create_label "ci-failure" "Auto-filed: a non-gating workflow failed on main"
          create_label "$WORKFLOW_LABEL" "Auto-filed failures for $WORKFLOW_NAME"

      - name: Find existing tracking issue
        if: steps.gate.outputs.actionable == 'true'
        id: existing
        env:
          WORKFLOW_LABEL: ${{ steps.labels.outputs.workflow_label }}
        run: |
          number=$(gh issue list --state open --label "ci-failure" --label "$WORKFLOW_LABEL" \
            --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Resolve on success
        if: env.CONCLUSION == 'success' && steps.existing.outputs.number != ''
        env:
          ISSUE_NUMBER: ${{ steps.existing.outputs.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" \
            --comment "✅ [$WORKFLOW_NAME run]($RUN_URL) passed — resolving."

      - name: Gather failing job detail
        if: steps.gate.outputs.actionable == 'true' && env.CONCLUSION != 'success'
        id: detail
        run: |
          # FAILING_JOB_JQ (job env above) matches anything but success/skipped/cancelled,
          # not just "failure" — a timed-out or action_required job reports
          # conclusion: "timed_out"/"action_required", not "failure", and would otherwise
          # be silently dropped from the report. Jobs cancelled by ci.yml's fail-fast are
          # excluded unless they hold a failed step, so the report names the real cause.
          # --paginate: the jobs endpoint defaults to 30 per page: without it, a
          # watched workflow with more than 30 jobs would silently drop failing jobs
          # past the first page from the report.
          jobs_json=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            | jq -s '{jobs: [.[].jobs[]]}')
          failing_names=$(echo "$jobs_json" | jq -r "[.jobs[] | $FAILING_JOB_JQ | .name] | join(\", \")")
          first_failing_id=$(echo "$jobs_json" | jq -r "[.jobs[] | $FAILING_JOB_JQ][0].id // empty")
          echo "failing_names=$failing_names" >> "$GITHUB_OUTPUT"
          {
            echo "log_excerpt<<EOF_$RUN_ID"
            if [ -n "$first_failing_id" ]; then
              # Bounded excerpt from the first failing job only — ci.yml can have
              # several of its jobs (including any of the five e2e jobs) fail at once,
              # and a full dump from all of them would make the issue body unreadable.
              # Full detail is always one click away via $RUN_URL.
              gh run view "$RUN_ID" --job "$first_failing_id" --log-failed 2>/dev/null \
                | tail -n 100 | tail -c 8000
            else
              echo "(no individual job reported failure — see run for detail)"
            fi
            echo "EOF_$RUN_ID"
          } >> "$GITHUB_OUTPUT"

      # Everything interpolated here is routed through env: (not inline ${{ }} in
      # the script body) so log content pulled from a test run is never re-parsed
      # as shell syntax by the heredoc it's substituted into.
      - name: File or update failure issue
        if: steps.gate.outputs.actionable == 'true' && env.CONCLUSION != 'success'
        env:
          ISSUE_NUMBER: ${{ steps.existing.outputs.number }}
          WORKFLOW_LABEL: ${{ steps.labels.outputs.workflow_label }}
          FAILING_NAMES: ${{ steps.detail.outputs.failing_names }}
          LOG_EXCERPT: ${{ steps.detail.outputs.log_excerpt }}
        run: |
          failing_display="${FAILING_NAMES:-(none reported — see run for detail)}"
          body=$(cat <<BODYEOF_$RUN_ID
          **Workflow**: $WORKFLOW_NAME
          **Conclusion**: $CONCLUSION
          **Run**: $RUN_URL
          **Failing jobs**: $failing_display

          <details><summary>Log excerpt (first failing job, tail)</summary>

          \`\`\`
          $LOG_EXCERPT
          \`\`\`

          </details>
          BODYEOF_$RUN_ID
          )
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "$body"
          else
            gh issue create \
              --title "ci-failure: $WORKFLOW_NAME failing on main" \
              --label "ci-failure" \
              --label "$WORKFLOW_LABEL" \
              --assignee verveguy \
              --body "$body"
          fi
