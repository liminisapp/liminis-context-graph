# Notebook ontology v3.2 (E13 / #815): v3.1 with full relation signatures and edge direction.
# - Every description opens with how the relation reads: in 'X REL Y', X is the source.
# - source_type / target_type may be a list; an unset side accepts any type.
# - inverse_aliases: names that read the other way; they map to this type with the endpoints swapped.
# - symmetric: endpoint order carries no meaning.
# - Removed aliases that read the other way or had the wrong subject: SUPERSEDES REPLACED/SWITCHED_FROM, HAS_ROLE ROLE_OF,
#   HAS_TERM RENEWAL_DATE_FOR/SPECIFIES_UPTIME_FOR, APPROVES HAS_EXCEPTION_APPROVER, DISCUSSED DISCUSSED_IN, CITES CITED_IN/DOCUMENTED_IN.
# Needs the LCG direction fix to load (lists, inverse_aliases, symmetric).
mode: strict
entity_types:
- name: Person
  description: A human individual, not a role or title.
- name: Team
  description: A group, team or department inside our own organisation.
- name: Organization
  description: An outside party such as a supplier, vendor, customer, partner or regulator.
- name: Project
  description: An initiative, programme or product effort that has an owner and goals.
- name: System
  description: Software, a service, tool, dataset or piece of infrastructure we run or use.
- name: Policy
  description: A rule, standard, procedure or requirement that governs how work is done.
- name: Decision
  description: A choice that was made or agreed, such as a design decision or a resolution.
- name: Agreement
  description: A contract, service-level agreement or other commitment with an outside party.
- name: Meeting
  description: A meeting, review, incident retrospective or other dated occasion where people met.
- name: Document
  description: A note, page, report, article or other written source.
- name: Topic
  description: A subject, practice, metric or idea that is none of the other types.
- name: Location
  description: A place, office, site or cloud region.
relation_types:
- name: OWNS
  description: 'X OWNS Y: X is the owner and Y is what is owned. A person or team is the accountable owner of a project, system,
    policy or agreement.'
  source_type:
  - Person
  - Team
  target_type:
  - Project
  - System
  - Policy
  - Agreement
  aliases:
  - OWNER_OF
  - IS_OWNER_OF
  - ACCOUNTABLE_FOR
  - BUDGET_OWNER
  inverse_aliases:
  - OWNED_BY
  - HAS_OWNER
  keywords:
  - owner
  - owns
  - accountable
- name: REPORTS_TO
  description: 'X REPORTS_TO Y: Y is X''s manager. A person reports to another person in the line-management structure.'
